[package]
name = "moyai-hub"
version = "1.0.4"
edition = "2024"
license = "MIT"
build = "build.rs"

[lib]
name = "moyai_hub"
path = "src/lib.rs"

[[bin]]
name = "moyai-hub"
path = "src/main.rs"

[[bin]]
name = "moyai-cleanup-hub"
path = "src/bin/moyai-cleanup-hub.rs"

[dependencies]
axum = "0.8.6"
base64 = "0.22.1"
fs2 = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tempfile = "3.23.0"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "io-std", "signal"] }
futures-core = "0.3.31"
futures-util = "0.3.32"
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
sha2 = "0.10.9"
ring = "0.17.14"
rusqlite = { version = "0.32.1", features = ["bundled"] }
time = "0.3.47"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
ulid = { version = "1.2.1", features = ["serde"] }
x509-parser = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
